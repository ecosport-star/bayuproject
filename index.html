<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPAL FREE AI LAB</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root { --bg-primary: #08080c; --accent-blue: #3b82f6; --accent-purple: #8b5cf6; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-primary); color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(to right, var(--accent-blue), var(--accent-purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); }
        .node-arrow::before { content: ''; display: block; width: 2px; height: 20px; background: rgba(255,255,255,0.2); margin: 0 auto; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;
        const h = React.createElement;

        const StorageService = {
            getProjects: () => { try { return JSON.parse(localStorage.getItem('opal_projects')) || []; } catch (e) { return []; } },
            saveProject: (project) => { const p = StorageService.getProjects(); const i = p.findIndex(x => x.id === project.id); if (i >= 0) p[i] = project; else p.push(project); localStorage.setItem('opal_projects', JSON.stringify(p)); },
            deleteProject: (id) => { localStorage.setItem('opal_projects', JSON.stringify(StorageService.getProjects().filter(p => p.id !== id))); }
        };

        const extractJson = (text) => { try { const m = text.match(/\{[\s\S]*\}/); return JSON.parse(m ? m[0] : text); } catch (e) { throw new Error("Gagal membaca JSON AI."); } };

        const generateFallbackWorkflow = (userPrompt) => ({
            name: "Custom AI Workflow",
            description: `Workflow untuk: ${userPrompt.substring(0, 50)}...`,
            steps: [
                { id: "s1", type: "FILE_UPLOAD", title: "Upload Media", prompt: "N/A", input: "File", output: "Media" },
                { id: "s2", type: "IMAGE_ANALYSIS", title: "Analyze Media", prompt: "Analyze media", input: "Media", output: "Text" },
                { id: "s3", type: "TEXT_GENERATION", title: "Generate Prompt", prompt: "Create prompt", input: "Text", output: "Prompt" },
                { id: "s4", type: "IMAGE_TO_VIDEO", title: "Generate Video", prompt: "Generate video", input: "Prompt", output: "Video" },
                { id: "s5", type: "FILE_OUTPUT", title: "Download Result", prompt: "N/A", input: "Video", output: "File" }
            ]
        });

        const ApiService = {
            callAI: async (prompt, apiKey, model) => {
                if (!apiKey) throw new Error("API Key Gemini kosong.");
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error.message.includes('not found') ? `Model tidak ditemukan` : data.error.message);
                    return data.candidates[0].content.parts[0].text;
                } catch (err) { throw new Error(err.message); }
            },
            
            // INTEGRASI HUGGING FACE GRATIS
            generateVideoHF: async (apiKey, mode, imageDataBase64, textPrompt) => {
                if (!apiKey) throw new Error("Hugging Face Token kosong. Isi di Settings.");
                
                let url = "";
                let body = null;
                let headers = { "Authorization": `Bearer ${apiKey}` };

                if (mode === 'image-to-video') {
                    url = "https://api-inference.huggingface.co/models/stabilityai/stable-video-diffusion-img2img-xt";
                    const byteChars = atob(imageDataBase64.split(',')[1]);
                    const byteArrays = new Uint8Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) byteArrays[i] = byteChars.charCodeAt(i);
                    body = new Blob([byteArrays], { type: "image/png" });
                } else {
                    url = "https://api-inference.huggingface.co/models/cerspense/zeroscope_v2_576w";
                    headers["Content-Type"] = "application/json";
                    body = JSON.stringify({ inputs: textPrompt });
                }

                const res = await fetch(url, { method: 'POST', headers, body });
                
                if (res.status === 503) throw new Error("Model sedang loading (gratis). Tunggu 20 detik lalu coba lagi.");
                if (!res.ok) { const err = await res.json(); throw new Error(err.error || "Gagal generate video."); }
                
                const blob = await res.blob();
                return URL.createObjectURL(blob);
            }
        };

        const Icon = ({ name, className = "w-4 h-4" }) => { useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, []); return h('i', { 'data-lucide': name, className }); };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
            return h('div', { className: `fixed bottom-20 right-6 z-50 px-6 py-3 rounded-xl glass-card flex items-center gap-3 border-l-4 ${type === 'success' ? 'border-green-500' : 'border-red-500'}` },
                h(Icon, { name: type === 'success' ? 'check-circle' : 'alert-circle', className: "w-5 h-5" }), h('span', { className: "text-sm" }, message)
            );
        };

        const Sidebar = ({ currentPage, setPage }) => {
            const menus = [
                { id: 'dashboard', name: 'Dashboard', icon: 'layout-dashboard' }, { id: 'create', name: 'Create App', icon: 'plus-circle' },
                { id: 'apps', name: 'My Apps', icon: 'grid' }, { id: 'prompt', name: 'Prompt Studio', icon: 'sparkles' },
                { id: 'image', name: 'Image AI', icon: 'image' }, { id: 'video', name: 'Video AI', icon: 'video' },
                { id: 'history', name: 'History', icon: 'history' }, { id: 'settings', name: 'Settings', icon: 'settings' }
            ];
            return h('aside', { className: "w-64 h-screen bg-black/40 border-r border-white/5 flex-col p-4 hidden md:flex" },
                h('div', { className: "flex items-center gap-2 mb-10 px-2" }, h('div', { className: "w-8 h-8 rounded-lg gradient-bg flex items-center justify-center" }, h(Icon, { name: "gem", className: "w-5 h-5" })), h('div', null, h('h1', { className: "text-sm font-bold" }, "OPAL FREE AI"), h('p', { className: "text-xs text-gray-500" }, "LAB"))),
                h('nav', { className: "flex flex-col gap-1 flex-1" }, menus.map(m => h('button', { key: m.id, onClick: () => setPage(m.id), className: `flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm ${currentPage === m.id ? 'bg-white/10 text-white' : 'text-gray-400 hover:bg-white/5'}` }, h(Icon, { name: m.icon, className: "w-4 h-4" }), m.name))),
                h('div', { className: "glass-card p-3 rounded-xl text-xs text-center" }, h('p', { className: "text-blue-400 font-bold" }, "FREE MODE ACTIVE"))
            );
        };

        const Header = ({ setPage, hasApiKey, goToSettings }) => 
            h('header', { className: "h-16 border-b border-white/5 bg-black/20 flex items-center justify-between px-6" },
                h('div', { className: "flex items-center gap-4 flex-1 max-w-md" }, h(Icon, { name: "search", className: "w-4 h-4 absolute left-3 text-gray-500" }), h('input', { type: "text", placeholder: "Search...", className: "w-full bg-white/5 border border-white/10 rounded-lg pl-10 pr-4 py-2 text-sm outline-none" })),
                h('div', { className: "flex items-center gap-3" }, !hasApiKey && h('button', { onClick: goToSettings, className: "text-yellow-400 text-xs bg-yellow-400/10 px-3 py-1.5 rounded-lg border border-yellow-400/20" }, "API Key Required"), h('button', { onClick: () => setPage('create'), className: "gradient-bg px-4 py-2 rounded-lg text-sm font-medium" }, " New App"))
            );

        const Dashboard = ({ setPage, projects }) => 
            h('div', { className: "p-8" }, h('h2', { className: "text-3xl font-bold mb-1" }, "Dashboard"), h('p', { className: "text-gray-400 mb-8" }, "Create AI Apps. Build Workflows. Run AI."),
                h('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-6 mb-10" }, ['Total Apps', 'Total Workflows', 'Generations'].map((s, i) => h('div', { key: s, className: "glass-card rounded-2xl p-6" }, h('p', { className: "text-gray-400 text-sm" }, s), h('p', { className: "text-4xl font-bold mt-1" }, i === 0 ? projects.length : 0)))),
                h('div', { className: "glass-card border border-dashed border-white/10 rounded-2xl p-16 text-center" }, h('h4', { className: "text-lg font-medium mb-2" }, "Belum ada aplikasi AI."), h('button', { onClick: () => setPage('create'), className: "gradient-bg px-6 py-2.5 rounded-lg font-medium mt-4" }, "CREATE YOUR FIRST AI APP"))
            );

        const CreateApp = ({ setPage, addToast, hasApiKey }) => {
            const [prompt, setPrompt] = useState(''); const [loading, setLoading] = useState(false); const [workflow, setWorkflow] = useState(null);
            const handleGenerate = async () => {
                if (!prompt || !hasApiKey) return;
                setLoading(true);
                try {
                    const systemPrompt = `Convert to JSON: {"name":"App","description":"Desc","steps":[{"id":"s1","type":"FILE_UPLOAD","title":"Upload","prompt":"N/A","input":"File","output":"File"}]}. Types: FILE_UPLOAD, IMAGE_ANALYSIS, TEXT_GENERATION, IMAGE_TO_VIDEO. Request: ${prompt}`;
                    const resText = await ApiService.callAI(systemPrompt, localStorage.getItem('opal_dev_key'), localStorage.getItem('opal_model') || 'gemini-1.5-flash-latest');
                    setWorkflow(extractJson(resText)); addToast('Workflow dibuat!', 'success');
                } catch { setWorkflow(generateFallbackWorkflow(prompt)); addToast('Fallback digunakan', 'success'); }
                setLoading(false);
            };
            const handleSave = () => { const p = { id: Date.now().toString(), name: workflow.name, description: workflow.description, prompt, workflow, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; StorageService.saveProject(p); addToast('Tersimpan!', 'success'); setPage('apps'); };

            return h('div', { className: "p-8 max-w-5xl mx-auto" },
                h('h2', { className: "text-4xl font-bold mb-2 gradient-text" }, "Create AI App"),
                h('div', { className: "glass-card rounded-2xl p-6 my-8" }, h('textarea', { className: "w-full bg-transparent border-none outline-none resize-none text-white placeholder-gray-600 mb-4 text-lg", rows: 4, placeholder: "Contoh: Buat video promosi jersey dari gambar.", value: prompt, onChange: e => setPrompt(e.target.value) }), h('button', { onClick: handleGenerate, disabled: loading, className: "gradient-bg px-8 py-3 rounded-lg font-medium flex items-center gap-2" }, loading ? h(Icon, { name: "loader-2", className: "w-4 h-4 animate-spin" }) : h(Icon, { name: "sparkles", className: "w-4 h-4" }), "GENERATE WORKFLOW")),
                workflow && h('div', { className: "glass-card rounded-2xl p-8" }, h('h3', { className: "text-2xl font-bold text-blue-400 mb-1" }, workflow.name), h('button', { onClick: handleSave, className: "bg-white/10 px-4 py-2 rounded-lg text-sm mt-4" }, "Save Project"))
            );
        };

        const MyApps = ({ setPage, projects, setProjects }) => h('div', { className: "p-8" }, h('h2', { className: "text-3xl font-bold mb-6" }, "My Apps"), projects.length === 0 ? h('div', { className: "glass-card p-16 text-center rounded-2xl" }, h('button', { onClick: () => setPage('create'), className: "gradient-bg px-6 py-2.5 rounded-lg" }, "CREATE WORKFLOW")) : h('div', { className: "grid grid-cols-3 gap-6" }, projects.map(p => h('div', { key: p.id, className: "glass-card rounded-2xl p-5" }, h('h4', { className: "font-bold text-lg mb-1" }, p.name), h('button', { onClick: () => { StorageService.deleteProject(p.id); setProjects(StorageService.getProjects()); }, className: "bg-red-500/10 text-red-400 p-2 rounded-lg text-xs mt-4" }, "Delete")))));

        const ImageAI = () => h('div', { className: "p-8" }, h('h2', { className: "text-3xl font-bold mb-6" }, "Image AI"), h('div', { className: "glass-card p-6 rounded-2xl border-l-4 border-yellow-500" }, "Free Tier Limitation"));

        const VideoAI = ({ addToast }) => {
            const [mode, setMode] = useState('image-to-video');
            const [imageData, setImageData] = useState(null);
            const [prompt, setPrompt] = useState("");
            const [loading, setLoading] = useState(false);
            const [videoUrl, setVideoUrl] = useState(null);
            const [error, setError] = useState("");

            const handleFile = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => setImageData(ev.target.result); r.readAsDataURL(f); };

            const handleGenerate = async () => {
                if (mode === 'image-to-video' && !imageData) return setError("Upload gambar dulu.");
                if (mode === 'text-to-video' && !prompt) return setError("Masukkan prompt dulu.");
                
                setLoading(true); setError(""); setVideoUrl(null);
                try {
                    const hfToken = localStorage.getItem('opal_hf_token');
                    const resultUrl = await ApiService.generateVideoHF(hfToken, mode, imageData, prompt);
                    setVideoUrl(resultUrl);
                    addToast("Video berhasil dibuat!", "success");
                } catch (err) { setError(err.message); addToast("Gagal generate", "error"); }
                setLoading(false);
            };

            return h('div', { className: "p-8" },
                h('h2', { className: "text-3xl font-bold mb-6" }, "Video AI Studio (FREE via HuggingFace)"),
                h('div', { className: "glass-card rounded-2xl p-4 mb-6 border-l-4 border-green-500" }, h('p', { className: "text-sm" }, "Menggunakan model Open Source: Stable Video Diffusion & Zeroscope. Gratis tanpa limit membayar.")),
                h('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-8" },
                    h('div', { className: "glass-card rounded-2xl p-6" },
                        h('div', { className: "flex gap-2 mb-4" }, 
                            h('button', { onClick: () => setMode('image-to-video'), className: `flex-1 py-2 rounded-lg text-sm ${mode === 'image-to-video' ? 'bg-blue-600' : 'bg-white/5'}` }, "Image to Video"),
                            h('button', { onClick: () => setMode('text-to-video'), className: `flex-1 py-2 rounded-lg text-sm ${mode === 'text-to-video' ? 'bg-blue-600' : 'bg-white/5'}` }, "Text to Video")
                        ),
                        mode === 'image-to-video' ? 
                            h('div', { className: "border-2 border-dashed border-white/10 rounded-lg p-4 mb-4 text-center" }, h('input', { type: "file", accept: "image/*", onChange: handleFile, className: "hidden", id: "v-up" }), h('label', { htmlFor: "v-up", className: "cursor-pointer" }, imageData ? h('img', { src: imageData, className: "max-h-32 mx-auto" }) : "Klik upload gambar")) 
                            : h('textarea', { className: "w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm mb-4", rows: 4, placeholder: "Astronot berkuda di mars...", value: prompt, onChange: e => setPrompt(e.target.value) }),
                        h('button', { onClick: handleGenerate, disabled: loading, className: "w-full gradient-bg py-3 rounded-lg font-medium flex items-center justify-center gap-2" }, loading ? h(Icon, { name: "loader-2", className: "w-4 h-4 animate-spin" }) : h(Icon, { name: "video", className: "w-4 h-4" }), "GENERATE VIDEO (FREE)")
                    ),
                    h('div', { className: "glass-card rounded-2xl p-6 flex items-center justify-center min-h-[300px]" },
                        error ? h('div', { className: "text-red-400 text-center" }, error) :
                        videoUrl ? h('video', { src: videoUrl, controls: true, className: "w-full rounded-lg" }) :
                        loading ? h('div', { className: "text-center" }, h(Icon, { name: "loader-2", className: "w-12 h-12 mx-auto mb-2 animate-spin text-blue-500" }), "Rendering... (Bisa memakan 30 detik)") :
                        h('div', { className: "text-center text-gray-500" }, "Hasil video akan muncul di sini")
                    )
                )
            );
        };

        const PromptStudio = ({ addToast, hasApiKey }) => h('div', { className: "p-8" }, h('h2', { className: "text-3xl font-bold mb-6" }, "Prompt Studio"), h('div', { className: "glass-card p-6 rounded-2xl" }, "Fitur Prompt Studio"));
        const History = () => h('div', { className: "p-8" }, h('h2', { className: "text-3xl font-bold mb-6" }, "History"), h('div', { className: "glass-card p-8 text-center rounded-2xl" }, "Belum ada riwayat."));

        const Settings = ({ addToast, updateApiKeyState }) => {
            const [geminiKey, setGeminiKey] = useState(localStorage.getItem('opal_dev_key') || '');
            const [model, setModel] = useState(localStorage.getItem('opal_model') || 'gemini-1.5-flash-latest');
            const [hfToken, setHfToken] = useState(localStorage.getItem('opal_hf_token') || '');

            const save = () => {
                localStorage.setItem('opal_dev_key', geminiKey);
                localStorage.setItem('opal_model', model);
                localStorage.setItem('opal_hf_token', hfToken);
                updateApiKeyState(!!geminiKey);
                addToast('Settings disimpan!', 'success');
            };

            return h('div', { className: "p-8 max-w-3xl" },
                h('h2', { className: "text-3xl font-bold mb-6" }, "Settings"),
                h('div', { className: "glass-card rounded-2xl p-6 mb-6" },
                    h('h3', { className: "font-bold mb-4" }, "Gemini AI Config (Text/Analyze)"),
                    h('input', { type: "password", className: "w-full bg-white/5 border border-white/10 rounded-lg p-3 mb-4 text-sm", placeholder: "Gemini API Key", value: geminiKey, onChange: e => setGeminiKey(e.target.value) }),
                    h('input', { type: "text", className: "w-full bg-white/5 border border-white/10 rounded-lg p-3 mb-4 text-sm", placeholder: "Model (gemini-1.5-flash-latest)", value: model, onChange: e => setModel(e.target.value) })
                ),
                h('div', { className: "glass-card rounded-2xl p-6 mb-6 border-l-4 border-green-500" },
                    h('h3', { className: "font-bold mb-4" }, "Hugging Face Token (Video AI Gratis)"),
                    h('p', { className: "text-xs text-gray-400 mb-4" }, "Dapatkan token gratis di huggingface.co/settings/tokens"),
                    h('input', { type: "password", className: "w-full bg-white/5 border border-white/10 rounded-lg p-3 mb-4 text-sm", placeholder: "hf_xxxxxxxx", value: hfToken, onChange: e => setHfToken(e.target.value) })
                ),
                h('button', { onClick: save, className: "bg-blue-600 px-4 py-2 rounded-lg text-sm" }, "Save Settings")
            );
        };

        const App = () => {
            const [page, setPage] = useState('dashboard');
            const [projects, setProjects] = useState([]);
            const [toast, setToast] = useState(null);
            const [hasApiKey, setHasApiKey] = useState(false);

            useEffect(() => { setProjects(StorageService.getProjects()); setHasApiKey(!!localStorage.getItem('opal_dev_key')); if (window.lucide) window.lucide.createIcons(); }, []);
            const addToast = (m, t) => setToast({ message: m, type: t });

            const render = () => {
                switch(page) {
                    case 'dashboard': return h(Dashboard, { setPage, projects });
                    case 'create': return h(CreateApp, { setPage, addToast, hasApiKey });
                    case 'apps': return h(MyApps, { setPage, projects, setProjects });
                    case 'video': return h(VideoAI, { addToast });
                    case 'settings': return h(Settings, { addToast, updateApiKeyState: setHasApiKey });
                    default: return h(Dashboard, { setPage, projects });
                }
            };

            return h('div', { className: "flex h-screen bg-[#08080c] text-white" },
                h(Sidebar, { currentPage: page, setPage }),
                h('main', { className: "flex-1 overflow-y-auto h-screen" },
                    h(Header, { setPage, hasApiKey, goToSettings: () => setPage('settings') }),
                    h('div', { className: "pb-20" }, render())
                ),
                toast && h(Toast, { ...toast, onClose: () => setToast(null) }),
                h('nav', { className: "fixed bottom-0 left-0 right-0 bg-black/80 border-t border-white/10 flex justify-around p-2 md:hidden" }, ['dashboard', 'create', 'apps', 'settings'].map(p => h('button', { key: p, onClick: () => setPage(p), className: `p-2 ${page === p ? 'text-blue-400' : 'text-gray-500'}` }, h(Icon, { name: p, className: "w-6 h-6" }))))
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(h(App));
    </script>
</body>
</html>
